name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Fail fast before spending CI time on lint/test/build if the release secrets aren't set up.
      - name: Validate required secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=()
          [ -z "$KEYSTORE_BASE64" ] && missing+=("KEYSTORE_BASE64")
          [ -z "$KEYSTORE_PASSWORD" ] && missing+=("KEYSTORE_PASSWORD")
          [ -z "$KEY_ALIAS" ] && missing+=("KEY_ALIAS")
          [ -z "$KEY_PASSWORD" ] && missing+=("KEY_PASSWORD")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required Action secrets: ${missing[*]}"
            exit 1
          fi

      # PR Checks (pr.yml) validates the PR branch/merge ref, but a squash- or rebase-merge lands
      # a commit on main that was never itself built or tested, so this is the only gate that
      # actually covers the exact commit about to be released.
      - name: Run ktlint
        run: ./gradlew ktlintCheck --console=plain --no-daemon --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      # Builds both distribution flavors' release variants (assembleRelease aggregates
      # assembleGithubRelease + assemblePlaystoreRelease - see app/build.gradle.kts
      # productFlavors): "github" keeps the in-app self-update flow for the direct-APK build
      # published below, "playstore" has that flow stripped entirely and is meant for upload to
      # the Play Console instead.
      - name: Build signed release APKs
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: "1.0.${{ github.run_number }}"
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # Renames each flavor's build output to a release-facing artifact name and computes its
      # SHA-1 so both can be surfaced consistently (asset names + release notes) in the next step.
      - name: Prepare release artifacts
        id: artifact
        env:
          VERSION_NAME: "1.0.${{ github.run_number }}"
        run: |
          VERSION_UNDERSCORE="${VERSION_NAME//./_}"

          GITHUB_APK_PATH="app/build/outputs/apk/github/release/FamilyMoments_version${VERSION_UNDERSCORE}-github.apk"
          mv app/build/outputs/apk/github/release/app-github-release.apk "$GITHUB_APK_PATH"
          GITHUB_SHA1=$(sha1sum "$GITHUB_APK_PATH" | awk '{print $1}')
          echo "github_apk_path=$GITHUB_APK_PATH" >> "$GITHUB_OUTPUT"
          echo "github_sha1=$GITHUB_SHA1" >> "$GITHUB_OUTPUT"

          PLAYSTORE_APK_PATH="app/build/outputs/apk/playstore/release/FamilyMoments_version${VERSION_UNDERSCORE}-playstore.apk"
          mv app/build/outputs/apk/playstore/release/app-playstore-release.apk "$PLAYSTORE_APK_PATH"
          PLAYSTORE_SHA1=$(sha1sum "$PLAYSTORE_APK_PATH" | awk '{print $1}')
          echo "playstore_apk_path=$PLAYSTORE_APK_PATH" >> "$GITHUB_OUTPUT"
          echo "playstore_sha1=$PLAYSTORE_SHA1" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: "1.0.${{ github.run_number }}"
          GITHUB_APK_PATH: ${{ steps.artifact.outputs.github_apk_path }}
          GITHUB_SHA1: ${{ steps.artifact.outputs.github_sha1 }}
          PLAYSTORE_APK_PATH: ${{ steps.artifact.outputs.playstore_apk_path }}
          PLAYSTORE_SHA1: ${{ steps.artifact.outputs.playstore_sha1 }}
        run: |
          gh release create "v${VERSION_NAME}" \
            "$GITHUB_APK_PATH" \
            "$PLAYSTORE_APK_PATH" \
            --title "v${VERSION_NAME}" \
            --notes "**github flavor (self-updating) SHA-1:** \`${GITHUB_SHA1}\`
          **playstore flavor (no self-update) SHA-1:** \`${PLAYSTORE_SHA1}\`" \
            --generate-notes

      # Optional: only runs once a Play Console service account key is configured (see AGENTS.md).
      # Uploads the playstore flavor's release App Bundle to the Play Console's "internal" track
      # (or PLAY_TRACK, if set as a repo variable) via the Gradle Play Publisher plugin
      # (app/build.gradle.kts) - it never touches the "github" flavor, which shares the same
      # applicationId and must never be uploaded. Left off entirely until the secret exists so
      # forks/clones without Play Console access keep getting GitHub Releases.
      - name: Publish to Play Store
        if: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS != '' }}
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: "1.0.${{ github.run_number }}"
        run: ./gradlew publishPlaystoreReleaseBundle --no-daemon --stacktrace

      - name: Skip Play Store publish
        if: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS == '' }}
        run: echo "::notice::ANDROID_PUBLISHER_CREDENTIALS secret not set - skipping Play Store publish. See AGENTS.md for setup."
