name: PR Checks

on:
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # ─── Lint ───────────────────────────────────────────────────────────────────
  lint:
    name: ktlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run ktlint
        run: ./gradlew ktlintCheck --console=plain --no-daemon --stacktrace

  # ─── Compile ────────────────────────────────────────────────────────────────
  compile:
    name: Compile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compile debug
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

  # ─── Minified Release ───────────────────────────────────────────────────────
  # `assembleDebug` above never runs R8, so a broken keep rule in app/proguard-rules.pro is
  # invisible to it and would only surface in .github/workflows/release.yml, after the merge to
  # main. This job builds the same minified/obfuscated/resource-shrunk output the release
  # workflow does (both distribution flavors) and then asserts on R8's mapping file that
  # obfuscation actually happened and that the two names Room resolves reflectively survived it,
  # so a regression in the shrinker config fails the PR instead of the release.
  # No signing secrets are needed: app/build.gradle.kts falls back to debug signing when
  # KEYSTORE_FILE is unset, and shrinking is identical either way.
  minified-release:
    name: Minified Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build minified release APKs
        run: ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace

      - name: Verify obfuscation
        run: ./scripts/verify-obfuscation.sh

      # The mapping file is the only way to read a stack trace from these builds, and it is also
      # what a reviewer needs to inspect what R8 renamed or removed on this PR.
      - name: Upload R8 mapping files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r8-mapping-files
          path: androidApp/build/outputs/mapping/*Release/
          # Not "error": this step runs with always(), so a build that failed before R8 ran has
          # nothing to upload and should report the build failure, not an artifact one.
          if-no-files-found: warn

  # ─── Unit Tests ─────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Every core:*/feature:*/app module is a KMP android-library now, whose host-side unit tests
      # run under testAndroidHostTest (the com.android.kotlin.multiplatform.library plugin's
      # withHostTestBuilder registers that name, not testDebugUnitTest - see build-logic's
      # kmp-library.gradle.kts); that task also covers everything in commonTest. androidApp is the
      # one classic com.android.application module left and it is flavored, so its unit-test task
      # has to be named per flavor - the unflavored testDebugUnitTest is ambiguous there and no
      # longer exists anywhere else in the build.
      - name: Run unit tests
        run: ./gradlew testAndroidHostTest :androidApp:testGithubDebugUnitTest :androidApp:testPlaystoreDebugUnitTest --no-daemon --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: |
            **/build/test-results/**/*.xml
            **/build/test-results/testAndroidHostTest/**.xml

      - name: Publish unit test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            **/build/test-results/**/*.xml
            **/build/test-results/testAndroidHostTest/**.xml
          comment_title: '🧪 Unit Test Results'

  # ─── Code Coverage ──────────────────────────────────────────────────────────
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # AGP's built-in coverage only instruments Android variants, and since the KMP migration
      # essentially all of this project's code lives in commonMain source sets it cannot see.
      # Kover aggregates every module into one report at the root project - see the root
      # build.gradle.kts's kover {} block and its kover(project(...)) dependencies.
      - name: Run tests with coverage
        run: ./gradlew koverXmlReport --no-daemon --stacktrace

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: build/reports/kover/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: build/reports/kover/report.xml
          fail_ci_if_error: false
          verbose: true

  # ─── iOS ────────────────────────────────────────────────────────────────────
  # Compiles the shared KMP code for both iOS targets and builds the Xcode wrapper against the
  # simulator SDK. No Apple Developer signing is configured (CODE_SIGNING_ALLOWED=NO), so this
  # proves the iOS build works without any Apple credentials as repo secrets - shipping to
  # TestFlight/the App Store is a separate, later decision.
  ios:
    name: iOS (simulator)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compile shared KMP code for iOS
        run: ./gradlew :app:compileKotlinIosArm64 :app:compileKotlinIosSimulatorArm64 --no-daemon --stacktrace

      - name: Build iosApp for the simulator
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  # ─── Web ────────────────────────────────────────────────────────────────────
  # Builds the same wasmJs production distribution .github/workflows/deploy-pages.yml publishes to
  # couples.loopgain.org, so a change that breaks the web build fails the PR rather than the deploy.
  web:
    name: Web (wasmJs)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build wasmJs production distribution
        run: ./gradlew :webApp:wasmJsBrowserDistribution --no-daemon --stacktrace
