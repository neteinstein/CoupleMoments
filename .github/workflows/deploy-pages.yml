name: Deploy Web (GitHub Pages)

# Deploys webApp's wasmJs production build to GitHub Pages on every push to `main`. Requires repo
# Settings -> Pages -> Build and deployment -> Source to be set to "GitHub Actions" (not "Deploy
# from a branch") - the deploy job below publishes via actions/deploy-pages, which only takes
# effect under that source setting. The custom domain (couples.loopgain.org, see the repo-root
# CNAME file) is configured separately in that same Settings -> Pages screen - an Actions-sourced
# deployment ignores any CNAME file in the repo or build artifact entirely.

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  build:
    name: Build wasmJs distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # :webApp:generateFirebaseWebInit bakes these into the firebase-init.js that ships in the
      # distribution - they are the browser-side Firebase config, kept out of the repo rather than
      # hardcoded in index.html. With none set the task emits its no-op stub and the deployed site
      # simply reports nothing; it never fails the deploy. Note that whatever is set here IS
      # readable by anyone who opens devtools on the deployed page - that is inherent to a Firebase
      # Web config, which is why access is controlled by API key restrictions in the Google Cloud
      # console, not by keeping these values secret.
      - name: Build wasmJs production distribution
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_AUTH_DOMAIN: ${{ secrets.FIREBASE_WEB_AUTH_DOMAIN }}
          FIREBASE_WEB_PROJECT_ID: ${{ secrets.FIREBASE_WEB_PROJECT_ID }}
          FIREBASE_WEB_STORAGE_BUCKET: ${{ secrets.FIREBASE_WEB_STORAGE_BUCKET }}
          FIREBASE_WEB_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_WEB_MESSAGING_SENDER_ID }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
          FIREBASE_WEB_MEASUREMENT_ID: ${{ secrets.FIREBASE_WEB_MEASUREMENT_ID }}
        run: ./gradlew :webApp:wasmJsBrowserDistribution --no-daemon --stacktrace

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webApp/build/dist/wasmJs/productionExecutable

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
