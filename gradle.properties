org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Obfuscation/shrinking for the `release` build type (app/build.gradle.kts + app/proguard-rules.pro).
# Full mode is AGP's default from 8.0 onwards; pinned explicitly so the release build's shrinking
# behaviour is stated rather than inherited, and so a future AGP default flip is a visible change
# to this file instead of a silent one. Full mode is what makes the aggressive keep-nothing-by-
# default posture in app/proguard-rules.pro effective.
android.enableR8.fullMode=true

# The app's marketing version, and the single source of truth for the release line. Local/debug
# builds use it verbatim - it's what Settings' "About" section shows - while
# .github/workflows/release.yml reads it back out of this file, keeps its major.minor, and
# substitutes the GitHub Actions run number for the patch segment (so main's 37th run publishes
# v1.1.37). Bumping the release line is therefore a one-line edit here rather than a scattered
# change across app/build.gradle.kts and the workflow. Keep the major.minor.patch shape: the
# workflow rejects anything else, and core:domain's isNewerVersion compares segment by segment.
couples.versionName=1.1.0
